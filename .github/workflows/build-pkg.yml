name: Build PKG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project GitHubWidget.xcodeproj \
            -scheme GitHubWidget \
            -configuration Release \
            -archivePath build/GitHubWidget.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGN_IDENTITY="-"

      - name: Build PKG
        run: |
          mkdir -p build/pkg-root/Applications
          ditto \
            build/GitHubWidget.xcarchive/Products/Applications/GitHubWidget.app \
            build/pkg-root/Applications/GitHubWidget.app

          pkgbuild \
            --root build/pkg-root \
            --identifier com.github-widget.GitHubWidget \
            --version "$VERSION" \
            --install-location / \
            "build/GitHubWidget-${VERSION}.pkg"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.VERSION }}"
          files: "build/GitHubWidget-${{ env.VERSION }}.pkg"
          generate_release_notes: true

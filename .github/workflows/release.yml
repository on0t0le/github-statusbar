name: Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - ".github/**"
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: patch
        type: choice
        options: [ patch, minor, major ]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: ${{ inputs.bump || 'patch' }}
          MAJOR_STRING_TOKEN: "BREAKING CHANGE"
          MINOR_STRING_TOKEN: "feat:"
          PATCH_STRING_TOKEN: "fix:"

      - name: Sync MARKETING_VERSION in project.yml
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          VERSION="${NEW_TAG#v}"
          sed -i "s/MARKETING_VERSION: \"[^\"]*\"/MARKETING_VERSION: \"${VERSION}\"/" project.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.yml
          git diff --staged --quiet || git commit -m "chore: bump MARKETING_VERSION to ${NEW_TAG} [skip ci]"
          git push

  build:
    needs: tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set version env
        run: echo "VERSION=${{ needs.tag.outputs.new_tag }}" >> "$GITHUB_ENV"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project GitHubWidget.xcodeproj \
            -scheme GitHubWidget \
            -configuration Release \
            -archivePath build/GitHubWidget.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${VERSION#v}" \
            CODE_SIGN_IDENTITY="-"

      - name: Build PKG
        run: |
          mkdir -p build/pkg-root/Applications
          ditto \
            build/GitHubWidget.xcarchive/Products/Applications/GitHubWidget.app \
            build/pkg-root/Applications/GitHubWidget.app

          pkgbuild \
            --root build/pkg-root \
            --identifier com.github-widget.GitHubWidget \
            --version "${VERSION#v}" \
            --install-location / \
            "build/GitHubWidget-${VERSION}.pkg"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          files: "build/GitHubWidget-${{ needs.tag.outputs.new_tag }}.pkg"
          generate_release_notes: true

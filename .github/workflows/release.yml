name: Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - ".github/**"
      - "**.md"
      - "docs/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from project.yml
        id: version
        run: |
          VERSION=$(python3 -c "
          import re
          content = open('project.yml').read()
          m = re.search(r'MARKETING_VERSION:\s*\"([^\"]+)\"', content)
          print(m.group(1))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Install xcodegen
        if: steps.check_tag.outputs.exists == 'false'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.check_tag.outputs.exists == 'false'
        run: xcodegen generate

      - name: Archive
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          xcodebuild archive \
            -project GitHubWidget.xcodeproj \
            -scheme GitHubWidget \
            -configuration Release \
            -archivePath build/GitHubWidget.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-"

      - name: Build PKG
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/pkg-root/Applications
          ditto \
            build/GitHubWidget.xcarchive/Products/Applications/GitHubWidget.app \
            build/pkg-root/Applications/GitHubWidget.app

          pkgbuild \
            --root build/pkg-root \
            --identifier com.github-widget.GitHubWidget \
            --version "$VERSION" \
            --install-location / \
            "build/GitHubWidget-v${VERSION}.pkg"

      - name: Create GitHub release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: build/GitHubWidget-v${{ steps.version.outputs.version }}.pkg
          generate_release_notes: true
